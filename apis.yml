name: Graft
description: 'Graft was a San Francisco-based AI platform company founded in 2021 by Adam Oliner
  (former Head of Machine Learning at Slack and Splunk) and Eric Schkufza. Its "Intelligence Layer"
  operationalized foundation models — LLMs and multimodal models over text, images, audio, video and
  graphs — connecting internal documents, databases and knowledge bases so organizations could build
  production-grade generative, predictive and structured-analytics solutions without deep machine-learning
  expertise or infrastructure. Graft raised a $4.5M pre-seed led by GV (2022) and a $10M seed led by
  Radical Ventures (2023). In October 2025 the Graft team and technology were acquired by You.com, with
  Adam Oliner joining as Field CTO; the graft.com domain is no longer operated by the company and no
  public API, developer portal, or documentation surface remains.'
